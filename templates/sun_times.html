{% extends "base.html" %}
{% block title %}Sun Times{% endblock %}
{% block content %}
<section class="api-section">
    <div class="container">
        <div class="text-center mb-5">
            <h2>Sunrise & Sunset Times</h2>
            <form class="search-form">
                <div class="row g-2 justify-content-center">
                    <div class="col-sm-5">
                        <input type="number" step="0.000001" name="lat" 
                               class="form-control" placeholder="Latitude" 
                               value="{{ lat }}">
                    </div>
                    <div class="col-sm-5">
                        <input type="number" step="0.000001" name="lng" 
                               class="form-control" placeholder="Longitude" 
                               value="{{ lng }}">
                    </div>
                    <div class="col-sm-2">
                        <button type="submit" class="btn btn-primary w-100">Search</button>
                    </div>
                </div>
            </form>
        </div>

        {% if results %}
        <div class="card mx-auto" style="max-width: 400px;">
            <div class="card-body text-center">
                <h4 class="card-title mb-4">Solar Times</h4>
                <div class="list-group">
                    <div class="list-group-item">
                        <strong>Sunrise:</strong> {{ results.sunrise }}
                    </div>
                    <div class="list-group-item">
                        <strong>Sunset:</strong> {{ results.sunset }}
                    </div>
                    <div class="list-group-item">
                        <strong>Day Length:</strong> {{ results.day_length }}
                    </div>
                </div>
            </div>
        </div>
        {% endif %}
    </div>
</section>
{% endblock %}
